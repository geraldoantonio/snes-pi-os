# snes9x.cfg do snes-pi-os: modelo do PiSNES (snes9x.cfg.template, a5b427f)
# com o teclado remapeado. Substitui o arquivo instalado pelo pacote pisnes
# (overlay). O PiSNES lê este arquivo da pasta do próprio binário.

[Keyboard]
# Códigos do SDL 1.2 (SDL_keysym.h). Botão do SNES = tecla:
# A = C, B = X, X = D, Y = S, L = A, R = Z, Start = Enter, Select = Espaço,
# direcional = setas, Esc sai do jogo (grava o save).
A_1=99
B_1=120
X_1=100
Y_1=115
L_1=97
R_1=122
START_1=13
SELECT_1=32
LEFT_1=276
RIGHT_1=275
UP_1=273
DOWN_1=274
QUIT=27
ACCEL=8

[Joystick]
# Controle USB genérico estilo SNES (ex.: Knup KP-3124), mesma numeração que
# o launcher usa (BTN_TRIGGER = 0 ... BTN_BASE4 = 9; conferir com
# "jstest /dev/input/js0"). O modelo do PiSNES vinha com o Xbox 360.
# Atalhos: Select + Start sai (grava o save), Select + R grava o estado,
# Select + L carrega o estado. QUIT, ACCEL, QLOAD e QSAVE ficam em botões que
# o controle não tem (28 a 31): no modelo, QSAVE=9 era o Start destes
# controles e gravava o estado sem parar enquanto ele estava apertado.
A_1=1
B_1=2
X_1=0
Y_1=3
L_1=4
R_1=5
START_1=9
SELECT_1=8
QUIT=31
ACCEL=30
QLOAD=29
QSAVE=28
# direcional: eixos 0 (esquerda/direita) e 1 (cima/baixo)
JA_LR=0
JA_UD=1
# direcional como botões: não usado nestes controles
LEFT_1=24
RIGHT_1=25
UP_1=26
DOWN_1=27
# jogador 2 (segundo controle)
A_2=1
B_2=2
X_2=0
Y_2=3
L_2=4
R_2=5
START_2=9
SELECT_2=8
LEFT_2=24
RIGHT_2=25
UP_2=26
DOWN_2=27


[Graphics]
DisplaySmoothStretch=1
# Display Effect: 0 none, 1 scanlines, 2 phospher
# NOTE Phospher does not run at full speed
DisplayEffect=0
MaintainAspectRatio=1
DisplayBorder=0
AutoFrameskip=1
Frameskip=200
Transparency=1
CPUCycles=100

[Sound]
APUEnabled=1
# Sound rates below as index, i.e. 7=44100 (some of these produce static)
# 0, 8192, 11025, 16000, 22050, 29300, 32000, 44100
SoundPlaybackRate=7
# Enable on RPI2 for clearer sound, disable on RPI1 due to performance impact
InterpolatedSound=0
