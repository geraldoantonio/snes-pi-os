name: build

on:
  push:
    branches: [main]
    tags: ['v*', 'arcade-v*']
  pull_request:
  workflow_dispatch:
  # Toda segunda: build da imagem na main, para o cache não expirar (o
  # GitHub apaga caches sem uso há 7 dias).
  schedule:
    - cron: '0 6 * * 1'

env:
  BR_VERSION: 2025.02.19

jobs:
  # Rápido (~1 min): valida a defconfig e o estilo dos pacotes.
  check:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Push na main: a imagem só é compilada se algo que vai nela mudou
      - name: A imagem mudou?
        id: changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --quiet "$BEFORE" HEAD -- external launcher \
              scripts/build.sh scripts/ci-container.sh scripts/qemu-smoke.sh \
              scripts/qemu_screendump.py .github/workflows/build.yml 2>/dev/null; then
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Baixar Buildroot
        run: git clone -q --depth 1 --branch "$BR_VERSION" https://gitlab.com/buildroot.org/buildroot.git /tmp/br

      - name: check-package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-magic python3-flake8 shellcheck >/dev/null
          /tmp/br/utils/check-package --br2-external \
            external/Config.in external/external.mk external/external.desc \
            external/package/*/*

      - name: Validar snespi_defconfig
        run: |
          make -C /tmp/br BR2_EXTERNAL="$PWD/external" O=/tmp/out snespi_defconfig
          make -C /tmp/br O=/tmp/out savedefconfig BR2_DEFCONFIG=/tmp/out/saved
          grep -q '^BR2_PACKAGE_PISNES=y' /tmp/out/.config

  # Rápido (~2 min): testa e compila o firmware do controle arcade (Pico).
  # Em tags arcade-v*, cria a Release do firmware (separada da imagem).
  firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # criar a Release nas tags arcade-v*
    steps:
      - uses: actions/checkout@v7

      - name: Conferir a tag com o arquivo VERSION
        if: startsWith(github.ref, 'refs/tags/arcade-v')
        run: |
          version="$(cat firmware/arcade/VERSION)"
          if [ "$GITHUB_REF_NAME" != "arcade-v$version" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com firmware/arcade/VERSION ($version)"
            exit 1
          fi

      - name: Testes da lógica
        run: make -C firmware/arcade test

      - name: Compilar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib >/dev/null
          WORK="$RUNNER_TEMP/pico" OUT="$RUNNER_TEMP/uf2" sh scripts/build-firmware.sh

      - name: Publicar firmware
        uses: actions/upload-artifact@v7
        with:
          name: snespi-arcade-${{ github.sha }}
          path: ${{ runner.temp }}/uf2/*.uf2
          retention-days: 14

      # Release pública só do firmware. Com --latest=false, a imagem do
      # sistema continua sendo a versão "mais recente" do repositório.
      - name: Criar release do firmware
        if: startsWith(github.ref, 'refs/tags/arcade-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat firmware/arcade/VERSION)"
          cd "$RUNNER_TEMP/uf2"
          sha256sum snespi-arcade-*.uf2 > "snespi-arcade-v$version.sha256"
          gh release create "$GITHUB_REF_NAME" snespi-arcade-*.uf2 "snespi-arcade-v$version.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Controle arcade v$version" \
            --notes-file "$GITHUB_WORKSPACE/.github/release-notes-arcade.md" \
            --latest=false

  # Lento (~1 h 30 sem cache). Roda em tags v* (cria a Release), manual,
  # toda segunda e em push na main que mude a imagem. O cache só é lido
  # entre refs a partir da main: os builds na main é que gravam o cache
  # que as tags usam (o de uma tag só serve para a própria tag).
  image:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      needs.check.outputs.image == 'true'
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write   # criar a Release nas tags v*
    steps:
      - uses: actions/checkout@v7

      - name: Liberar disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Restaurar cache (downloads e ccache)
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/work/dl
            ${{ runner.temp }}/work/ccache
          key: br-${{ env.BR_VERSION }}-${{ hashFiles('external/**') }}-${{ github.run_id }}
          restore-keys: |
            br-${{ env.BR_VERSION }}-${{ hashFiles('external/**') }}-
            br-${{ env.BR_VERSION }}-

      - name: Build no contêiner Debian 12
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          docker run --rm -e HOST_UID="$(id -u)" \
            -v "$GITHUB_WORKSPACE":/src:ro \
            -v "$RUNNER_TEMP/work":/work \
            debian:12 sh /src/scripts/ci-container.sh
          df -h /

      - name: Salvar cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/work/dl
            ${{ runner.temp }}/work/ccache
          key: br-${{ env.BR_VERSION }}-${{ hashFiles('external/**') }}-${{ github.run_id }}

      - name: Publicar imagem
        uses: actions/upload-artifact@v7
        with:
          name: snespi-sdcard-${{ github.sha }}
          path: ${{ runner.temp }}/work/output/images/sdcard.img.xz
          retention-days: 14
          compression-level: 0

      # Em tags v*: Release pública com a imagem e o hash.
      # Fica antes do teste no QEMU para não depender dele.
      - name: Criar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/work/output/images"
          img="snes-pi-os-$GITHUB_REF_NAME.img.xz"
          cp sdcard.img.xz "$img"
          sha256sum "$img" > "$img.sha256"
          gh release create "$GITHUB_REF_NAME" "$img" "$img.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "snes-pi-os $GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md"

      # Boota a imagem no QEMU (raspi1ap, mesmo SoC do Pi 1). Não testa a GPU
      # (PiSNES) nem áudio, mas pega erros de kernel, init, montagens e se o
      # launcher desenha. A imagem já foi publicada antes deste passo.
      - name: Teste de boot no QEMU
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-utils device-tree-compiler >/dev/null
          qemu-system-arm --version | head -1
          sh scripts/qemu-smoke.sh "$RUNNER_TEMP/work/output/images" "$RUNNER_TEMP/qemu"

      - name: Publicar resultado do QEMU
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-boot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qemu/tela.png
            ${{ runner.temp }}/qemu/serial.log
          retention-days: 14
          if-no-files-found: ignore
