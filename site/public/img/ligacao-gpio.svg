<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">Esquema de ligação do botão e do LED no GPIO</title>
<desc id="d">Conector de 26 pinos do Raspberry Pi 1 Model B rev 2. Botão entre o pino 5 (GPIO3) e o pino 6 (GND). LED de status: pino 11 (GPIO17), resistor de 330 ohms, perna longa do LED; perna curta no pino 9 (GND).</desc>
<style>
	text { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
	.n { font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
	.lbl { font-size: 14px; fill: #E8E6E1; }
	.sub { font-size: 12px; fill: #9AA3AE; }
	.sig { stroke: #F2A93B; stroke-width: 4; fill: none; stroke-linejoin: round; }
	.gnd { stroke: #C9CDD3; stroke-width: 4; fill: none; stroke-linejoin: round; }
</style>
<rect x="1" y="1" width="958" height="538" fill="#0E1116" stroke="#2A313C" stroke-width="2"/>

<!-- título -->
<text x="40" y="50" font-size="15" font-weight="600" letter-spacing="3" fill="#F2A93B">LIGAÇÃO NO GPIO</text>
<text x="40" y="76" class="sub" font-size="13">Raspberry Pi 1 Model B rev 2 · botão de desligar e LED de status</text>

<!-- miniatura da placa: onde fica o conector -->
<g transform="translate(812 40)">
	<rect x="0" y="0" width="118" height="78" rx="6" fill="#161B22" stroke="#3A4350" stroke-width="2"/>
	<rect x="8" y="6" width="56" height="10" fill="#F2A93B"/>
	<rect x="-6" y="26" width="14" height="30" fill="#3A4350"/>
	<rect x="86" y="50" width="34" height="22" fill="#2A313C"/>
	<text x="59" y="96" class="sub" text-anchor="middle">visto de cima</text>
	<text x="12" y="44" font-size="9" fill="#9AA3AE">SD</text>
	<text x="88" y="45" font-size="9" fill="#9AA3AE">USB</text>
</g>

<!-- conector P1 -->
<rect x="276" y="176" width="528" height="88" fill="#161B22" stroke="#3A4350" stroke-width="2"/>
<text x="816" y="204" class="sub">borda da placa</text>
<text x="816" y="244" class="sub">lado de dentro</text>
<text x="300" y="164" class="sub" text-anchor="middle">5V</text>
<text x="340" y="164" class="sub" text-anchor="middle">5V</text>
<text x="300" y="282" class="sub" text-anchor="middle">3V3</text>

<g>
	<!-- linha de cima: pinos pares -->
	<circle cx="300" cy="200" r="12" fill="#2A313C"/><text x="300" y="200" class="n" fill="#9AA3AE">2</text>
	<circle cx="340" cy="200" r="12" fill="#2A313C"/><text x="340" y="200" class="n" fill="#9AA3AE">4</text>
	<circle cx="380" cy="200" r="12" fill="#C9CDD3"/><text x="380" y="200" class="n" fill="#14100A">6</text>
	<circle cx="420" cy="200" r="12" fill="#2A313C"/><text x="420" y="200" class="n" fill="#9AA3AE">8</text>
	<circle cx="460" cy="200" r="12" fill="#2A313C"/><text x="460" y="200" class="n" fill="#9AA3AE">10</text>
	<circle cx="500" cy="200" r="12" fill="#2A313C"/><text x="500" y="200" class="n" fill="#9AA3AE">12</text>
	<circle cx="540" cy="200" r="12" fill="#2A313C"/><text x="540" y="200" class="n" fill="#9AA3AE">14</text>
	<circle cx="580" cy="200" r="12" fill="#2A313C"/><text x="580" y="200" class="n" fill="#9AA3AE">16</text>
	<circle cx="620" cy="200" r="12" fill="#2A313C"/><text x="620" y="200" class="n" fill="#9AA3AE">18</text>
	<circle cx="660" cy="200" r="12" fill="#2A313C"/><text x="660" y="200" class="n" fill="#9AA3AE">20</text>
	<circle cx="700" cy="200" r="12" fill="#2A313C"/><text x="700" y="200" class="n" fill="#9AA3AE">22</text>
	<circle cx="740" cy="200" r="12" fill="#2A313C"/><text x="740" y="200" class="n" fill="#9AA3AE">24</text>
	<circle cx="780" cy="200" r="12" fill="#2A313C"/><text x="780" y="200" class="n" fill="#9AA3AE">26</text>
	<!-- linha de baixo: pinos ímpares (o 1 é quadrado) -->
	<rect x="288" y="228" width="24" height="24" fill="#2A313C"/><text x="300" y="240" class="n" fill="#9AA3AE">1</text>
	<circle cx="340" cy="240" r="12" fill="#2A313C"/><text x="340" y="240" class="n" fill="#9AA3AE">3</text>
	<circle cx="380" cy="240" r="12" fill="#F2A93B"/><text x="380" y="240" class="n" fill="#14100A">5</text>
	<circle cx="420" cy="240" r="12" fill="#2A313C"/><text x="420" y="240" class="n" fill="#9AA3AE">7</text>
	<circle cx="460" cy="240" r="12" fill="#C9CDD3"/><text x="460" y="240" class="n" fill="#14100A">9</text>
	<circle cx="500" cy="240" r="12" fill="#F2A93B"/><text x="500" y="240" class="n" fill="#14100A">11</text>
	<circle cx="540" cy="240" r="12" fill="#2A313C"/><text x="540" y="240" class="n" fill="#9AA3AE">13</text>
	<circle cx="580" cy="240" r="12" fill="#2A313C"/><text x="580" y="240" class="n" fill="#9AA3AE">15</text>
	<circle cx="620" cy="240" r="12" fill="#2A313C"/><text x="620" y="240" class="n" fill="#9AA3AE">17</text>
	<circle cx="660" cy="240" r="12" fill="#2A313C"/><text x="660" y="240" class="n" fill="#9AA3AE">19</text>
	<circle cx="700" cy="240" r="12" fill="#2A313C"/><text x="700" y="240" class="n" fill="#9AA3AE">21</text>
	<circle cx="740" cy="240" r="12" fill="#2A313C"/><text x="740" y="240" class="n" fill="#9AA3AE">23</text>
	<circle cx="780" cy="240" r="12" fill="#2A313C"/><text x="780" y="240" class="n" fill="#9AA3AE">25</text>
</g>

<!-- botão: pino 6 (GND) e pino 5 (GPIO3) -->
<path class="gnd" d="M380 188 V130 H140 V188"/>
<path class="sig" d="M380 252 V320 H140 V256"/>
<rect x="104" y="188" width="72" height="68" rx="4" fill="#161B22" stroke="#E8E6E1" stroke-width="3"/>
<circle cx="140" cy="222" r="18" fill="#F2A93B"/>
<text x="390" y="124" class="lbl">pino 6 · GND</text>
<text x="200" y="344" class="lbl">pino 5 · GPIO3</text>
<text x="140" y="368" class="lbl" text-anchor="middle">Botão</text>
<text x="140" y="388" class="sub" text-anchor="middle">desliga com segurança</text>
<text x="140" y="404" class="sub" text-anchor="middle">e liga de novo</text>

<!-- LED: pino 11 -> 330 ohms -> LED -> pino 9 -->
<path class="sig" d="M500 252 V400 H572"/>
<path class="sig" d="M668 400 H720"/>
<path class="gnd" d="M770 400 H800 V460 H460 V252"/>
<!-- resistor -->
<rect x="572" y="388" width="96" height="24" rx="3" fill="#161B22" stroke="#E8E6E1" stroke-width="3"/>
<rect x="592" y="388" width="8" height="24" fill="#F2A93B"/>
<rect x="608" y="388" width="8" height="24" fill="#F2A93B"/>
<rect x="624" y="388" width="8" height="24" fill="#3A4350"/>
<text x="620" y="378" class="lbl" text-anchor="middle">330 Ω</text>
<!-- LED (triângulo para a direita: anodo à esquerda) -->
<path d="M720 380 L760 400 L720 420 Z" fill="#F2A93B"/>
<rect x="760" y="380" width="6" height="40" fill="#F2A93B"/>
<path d="M742 372 l12 -14 M750 358 h4 v4" stroke="#F2A93B" stroke-width="3" fill="none"/>
<path d="M756 380 l12 -14 M764 366 h4 v4" stroke="#F2A93B" stroke-width="3" fill="none"/>
<text x="816" y="388" class="lbl">LED</text>
<text x="816" y="408" class="sub">perna longa</text>
<text x="816" y="424" class="sub">no resistor</text>
<text x="510" y="300" class="lbl">pino 11 · GPIO17</text>
<text x="470" y="484" class="lbl">pino 9 · GND</text>

<!-- legenda -->
<line x1="40" y1="500" x2="920" y2="500" stroke="#2A313C" stroke-width="2"/>
<rect x="40" y="514" width="22" height="4" fill="#F2A93B"/><text x="70" y="520" class="sub">sinal</text>
<rect x="130" y="514" width="22" height="4" fill="#C9CDD3"/><text x="160" y="520" class="sub">GND</text>
<text x="220" y="520" class="sub">Pinos de 3,3 V: nunca ligue 5 V neles. Na placa rev 1, o pino 5 é o GPIO1.</text>
</svg>
