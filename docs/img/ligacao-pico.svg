<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 930" width="960" height="930" role="img" aria-labelledby="t d">
<title id="t">Ligação do controle arcade no Raspberry Pi Pico</title>
<desc id="d">Raspberry Pi Pico visto de cima, com o USB para cima. Jogador 1: cima, baixo, esquerda, direita, A, B, X, Y, L, R, Select e Start nos GP2 a GP13 (pinos 4 a 7, 9 a 12 e 14 a 17). Jogador 2: nos GP14 a GP22 e GP26 a GP28 (pinos 19 a 22, 24 a 27, 29, 31, 32 e 34). Cada chave liga o pino ao GND.</desc>
<style>
	text { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
	.n { font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
	.lbl { font-size: 14px; fill: #E8E6E1; dominant-baseline: central; }
	.gp { font-size: 12px; fill: #9AA3AE; dominant-baseline: central; }
	.sub { font-size: 12px; fill: #9AA3AE; }
</style>
<rect x="1" y="1" width="958" height="928" fill="#0E1116" stroke="#2A313C" stroke-width="2"/>
<text x="40" y="50" font-size="15" font-weight="600" letter-spacing="3" fill="#F2A93B">CONTROLE ARCADE NO PICO</text>
<text x="40" y="76" class="sub" font-size="13">Raspberry Pi Pico (RP2040), visto de cima · cada chave liga o pino ao GND</text>
