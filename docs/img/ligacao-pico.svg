<text x="40" y="886" class="sub">Sem resistor: o firmware liga o pull-up interno (3,3 V).</text>
<text x="40" y="906" class="sub">Os GNDs podem ser emendados de chave em chave.</text>
<text x="920" y="886" class="sub" text-anchor="end">Não ligue 5 V (VBUS) nos pinos GP.</text>
<text x="920" y="906" class="sub" text-anchor="end">Alavanca: a chave apertada fica do lado oposto.</text>
